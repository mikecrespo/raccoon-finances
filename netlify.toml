# Configuración para Netlify. No necesitas tocar nada aquí.
[build]
  publish = "."
  command = ""

# El service worker y la config de Firebase no deben quedarse "pegados" en caché:
# así, cuando vuelvas a publicar, los cambios llegan de inmediato.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/firebase-config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
